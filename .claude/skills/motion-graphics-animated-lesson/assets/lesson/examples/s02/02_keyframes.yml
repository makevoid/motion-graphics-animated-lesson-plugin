prof_talk:
  prompt: |-
    This asset belongs to a hyper quality, very interesting and potentially very fun viral animated explainer video. Deliver polished visual detail and expressive character acting with surprising, relevant details from the researched plan.

    SAME professor as image 1, same approved visual style, same proportions and costume. Single pose: medium shot from the waist up, the character occupies 85% of the frame height, centred slightly left of centre, facing the viewer with the chest turned a little toward screen-left, wooden pointer in the right hand held at chest height, left hand open in a warm welcoming gesture, eyebrows raised, mouth slightly open mid-word, both hands fully inside the frame.

    Background: one character, one pose, on perfectly flat chroma green #00B140 filling the entire background edge to edge, no floor, no cast shadow, no gradient, whole silhouette inside the frame with at least 6% margin on every side, no green anywhere on the character.

    STYLE: premium 2D animated-explainer illustration. Characters are semi-super-deformed, halfway between anime chibi and a Western cartoon: about 2.5 heads tall, a big head roughly 40% of total height, a small rounded body, large expressive eyes with simple highlights, readable hands with four fingers and a thumb. Clean, confident dark plum-black ink linework (#1B1A22) with slight weight variation; flat cel colour with one soft shadow tone and a subtle warm rim light; gentle gradients only in highlights; matte materials; crisp edges. Not photorealistic, not a 3D render, no halftone, no paper texture, no film grain. Colour world: slate-green chalkboard #1E3B34, warm chalk white #F3EFE4, paper cream #F6EEDC, terminal amber #FFB53D, with each character's own accent colours. No text, no letters, no numbers, no logos, no watermarks, no captions anywhere in the image.
