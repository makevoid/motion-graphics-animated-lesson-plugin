desk2022:
  prompt: |-
    This asset belongs to a hyper quality, very interesting and potentially very fun viral animated explainer video. Deliver polished visual detail and expressive character acting with surprising, relevant details from the researched plan.

    Use image 1 ONLY as the style reference for linework, colour treatment and rendering; do NOT include the character. Background plate in the same approved visual style: a cosy developer's apartment desk at night in late 2022, seen straight on at eye level, calm and readable. A long wooden desk runs across the lower 30% of the frame (the desk top edge at about 72% of the frame height). On the desk, centred slightly right of centre, two computer monitors side by side on simple stands: the main monitor is large and centred at about 58% of the width, its screen spans roughly from 38% to 78% of the width and from 22% to 62% of the height; a second smaller monitor sits to its right, angled slightly inward. Both screens are plain, flat, very dark navy-charcoal (#15161C), completely empty, evenly lit, with thin dark bezels and no reflections, no windows, no interface, no glow shapes. A ceramic coffee mug in warm terracotta with a wisp of steam near the right monitor, a friendly tangle of black and grey cables snaking off the back edge of the desk, three or four blank pastel sticky notes (cream, pink, pale yellow) stuck to the monitor bezels and the wall, a small desk lamp with warm amber light (#FFB53D) at the far right casting a soft pool of light. Behind the desk a deep indigo-blue night wall and a large window at the upper right showing a soft, out-of-focus city skyline with warm window lights and a few distant lights under a dark blue night sky. Keep the LEFT THIRD of the frame (0% to 33% of the width) calm and uncluttered: only the dim wall and the empty end of the desk there, no objects, so a character can stand there later. Keep the centre of the main monitor screen completely empty and flat. Moody night palette of deep indigo, navy and plum with warm amber accents from the lamp and the city. No chroma green or large green areas anywhere (no plants), no people, no characters, no robots, no hands, no text, no letters, no numbers, no logos, no writing on the sticky notes or screens.

    STYLE: premium 2D animated-explainer illustration. Characters are semi-super-deformed, halfway between anime chibi and a Western cartoon: about 2.5 heads tall, a big head roughly 40% of total height, a small rounded body, large expressive eyes with simple highlights, readable hands with four fingers and a thumb. Clean, confident dark plum-black ink linework (#1B1A22) with slight weight variation; flat cel colour with one soft shadow tone and a subtle warm rim light; gentle gradients only in highlights; matte materials; crisp edges. Not photorealistic, not a 3D render, no halftone, no paper texture, no film grain. Colour world: slate-green chalkboard #1E3B34, warm chalk white #F3EFE4, paper cream #F6EEDC, terminal amber #FFB53D, with each character's own accent colours. No text, no letters, no numbers, no logos, no watermarks, no captions anywhere in the image.
