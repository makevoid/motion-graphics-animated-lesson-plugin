lab:
  prompt: |-
    This asset belongs to a hyper quality, very interesting and potentially very fun viral animated explainer video. Deliver polished visual detail and expressive character acting with surprising, relevant details from the researched plan.

    Use image 1 ONLY as the style reference for linework, colour treatment and rendering; do NOT include the character. Background plate in the same approved visual style: a bright, airy, modern software workspace ("the lab") seen straight on at eye level, a calm optimistic morning mood that contrasts with a dark night apartment. A wide, gently curved terminal wall made of five large blank dark charcoal screen panels (#161A24) with thin rounded cream bezels, set side by side in one row across the upper-middle of the frame (from 7% to 93% of the width, from 9% to 56% of the height); the central panel is the widest; every panel is completely empty and dark, with only a faint soft reflection. Above the wall, a band of pale ceiling with a long skylight letting in soft warm daylight. Below the wall, a clean pale cream-and-light-oak floor with soft daylight pools, stretching open and empty across the whole lower 42% of the frame: the zones from 10% to 44% of the width and from 56% to 90% of the width must be completely clear, uncluttered open floor where characters will stand. Exactly two potted plants with round leafy shapes in simple terracotta pots, one tucked into the extreme bottom-left corner and one into the extreme bottom-right corner, each staying within the outer 8% of the width. A thin warm amber (#FFB53D) light strip runs along the bottom edge of the terminal wall. Palette: warm whites, paper cream #F6EEDC, light oak, charcoal panels, tiny accents of terracotta and indigo. Calm, clean, readable, with the dark panels as clear empty canvases. No people, no characters, no robots, no text, no writing, no numbers, no icons or UI on the screens, no logos anywhere.

    STYLE: premium 2D animated-explainer illustration. Characters are semi-super-deformed, halfway between anime chibi and a Western cartoon: about 2.5 heads tall, a big head roughly 40% of total height, a small rounded body, large expressive eyes with simple highlights, readable hands with four fingers and a thumb. Clean, confident dark plum-black ink linework (#1B1A22) with slight weight variation; flat cel colour with one soft shadow tone and a subtle warm rim light; gentle gradients only in highlights; matte materials; crisp edges. Not photorealistic, not a 3D render, no halftone, no paper texture, no film grain. Colour world: slate-green chalkboard #1E3B34, warm chalk white #F3EFE4, paper cream #F6EEDC, terminal amber #FFB53D, with each character's own accent colours. No text, no letters, no numbers, no logos, no watermarks, no captions anywhere in the image.
