# Finishing SFX over the assembled clean cut (all of s01–s09 against the narration master). Times are song seconds.
# User request (2026-09-30): the swoosh of the professor's pointer and the zzzz of the sleeping ChatGPT robot in the first 30 s.
# The "music" here is the narration, so rel_db is measured against the voice; cues sit in pauses or under words and stay subordinate.
source: output/clean_music.mp4    # clean video + narration + ducked music beds (music:bed, prompts/finish-music/music.yml)
out: output/with-sfx.mp4
rel_db: -8
peak_db: -6
max_gain_db: 12
negative: "music, melody, voice, speech, singing, reverb tail, noise hiss"
sounds:
  key_clack:      {prompt: "Crisp mechanical keyboard typing, a short burst of about ten keystrokes, close and dry, isolated", duration: 2, seed: 3}
  stamp_thud:     {prompt: "One heavy rubber stamp slamming onto a wooden desk, a single punchy thud, isolated", duration: 1, seed: 5}
  chalk_scratch:  {prompt: "Chalk writing quickly on a chalkboard, short scratchy strokes, isolated, dry", duration: 2, seed: 8}
  snore_zzz:      {prompt: "A cute small cartoon robot snoring softly, gentle electronic purring snore with a tiny whistle on each exhale, two slow breaths, isolated", duration: 4, seed: 12}
  startle_boing:  {prompt: "A short cartoon startle: a quick springy boing with a tiny electronic blip, comedic, isolated", duration: 1, seed: 14}
  pointer_swoosh: {prompt: "A fast thin wooden stick swishing through the air, one sharp whoosh, cartoon, isolated, dry", duration: 1, seed: 21}
  pop:            {prompt: "One short bright cartoon pop, like a character popping into frame, isolated", duration: 1, seed: 7}
  record_scratch: {prompt: "A vinyl record scratch stopping abruptly, comedic freeze, isolated", duration: 1, seed: 9}
  whip_zip:       {prompt: "A very fast cartoon zip whoosh, a character zipping away at high speed, isolated", duration: 1, seed: 17}
  paper_printer:  {prompt: "An old dot-matrix printer printing tractor-feed paper, buzzing rhythmic head movement and paper feed, isolated", duration: 3, seed: 31}
  scissor_snip:   {prompt: "One crisp pair of scissors snipping paper, a single clean snip, isolated", duration: 1, seed: 33}
  clock_tick:     {prompt: "A mechanical clock ticking steadily, four ticks, close and dry, isolated", duration: 2, seed: 41}
  server_hum:     {prompt: "An old server fan spinning up, a short rising hum and a relay click, isolated", duration: 2, seed: 43}
  angel_choir:    {prompt: "A tiny comedic heavenly choir 'aah' chord, short and sweet, isolated", duration: 2, seed: 45}
  calendar_flip:  {prompt: "Paper calendar pages flipping quickly, five fast flips, isolated", duration: 1.5, seed: 51}
  confetti_pop:   {prompt: "A party popper bang followed by a light confetti rustle, isolated", duration: 1.5, seed: 53}
  whoosh:         {prompt: "A short airy transition whoosh, cartoon, isolated", duration: 1, seed: 61}
  error_buzzer:   {prompt: "A short harsh computer error buzzer, two low buzzes, comedic, isolated", duration: 1, seed: 63}
  ding:           {prompt: "A small bright success ding, one note, like a test passing, isolated", duration: 1, seed: 71}
  chime:          {prompt: "A soft warm glockenspiel chime, three rising notes, gentle, isolated", duration: 2, seed: 73}
  keyboard_mash:  {prompt: "Frantic fast keyboard typing and hard key presses, panicky, isolated", duration: 2, seed: 75}
  gear_ratchet:   {prompt: "Small brass clockwork gears turning, soft rhythmic mechanical ratchet clicking, close and dry, isolated", duration: 3, seed: 85}
  credits_theme:  {prompt: "Whimsical cartoon end-credits theme, jaunty ragtime piano with pizzicato strings, light brushed drums and a playful clarinet, warm, bright, 112 bpm, instrumental, clean studio mix, steady from the first beat", duration: 36, seed: 81, negative: "voice, speech, singing, vocals, noise hiss, distortion, silence"}
